services:
  - type: web
    name: blogvista
    env: docker
    region: oregon
    plan: free
    envVars:
      - key: APP_NAME
        value: BlogVista
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: "https://blogvista.onrender.com"
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: database/database.sqlite
